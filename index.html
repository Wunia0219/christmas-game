<!doctype html>
<html lang="zh-Hant" class="lobby-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d2235" />
    <meta name="description" content="東勢長頸鹿美語的聖誕打磚塊遊戲大廳。" />
    <title>聖誕打磚塊大廳 | 東勢長頸鹿美語</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/lobby.css" />
    <script type="importmap">
      { "imports": { "pixi.js": "./vendor/pixi.mjs" } }
    </script>
  </head>
  <body>
    <div id="lobby-view">
      <div class="lobby-backdrop" aria-hidden="true">
        <canvas class="lobby-snow" id="lobby-snow"></canvas>
      </div>

      <main class="lobby-main">
        <section class="lobby-welcome" aria-labelledby="lobby-title">
          <div class="lobby-heading">
            <div class="lobby-brand">
              <button class="lobby-brand-logo" id="lobby-fullscreen" type="button" disabled
                aria-label="切換全螢幕" aria-description="快速點兩下標誌，或按 Enter。" aria-pressed="false">
                <img src="./assets/organizations/dongshi-giraffe.webp" alt="" width="160" height="160" />
              </button>
              <p class="lobby-brand-name">東勢長頸鹿美語</p>
              <p class="sr-only" id="lobby-announcement" role="status"></p>
            </div>
            <h1 class="lobby-title" id="lobby-title">聖誕打磚塊</h1>
          </div>

          <div class="lobby-entry">
            <label for="player-phone">手機號碼</label>
            <input id="player-phone" type="tel" inputmode="numeric" autocomplete="off" maxlength="10"
              placeholder="09XXXXXXXX" />
            <a class="lobby-start" id="enter-game" href="./game.html"><i class="play-icon" aria-hidden="true"></i>開始遊戲</a>
          </div>
        </section>

        <section class="lobby-leaderboard" aria-labelledby="leaderboard-title">
          <header class="leaderboard-header">
            <h2 id="leaderboard-title"><span class="leaderboard-trophy" aria-hidden="true"></span>排行榜</h2>
          </header>
          <div class="leaderboard-first">
            <p class="leaderboard-first-label">榜首</p>
            <p class="leaderboard-first-score"><span id="leader-score-value">18,450</span><canvas id="leader-score-pixels" aria-hidden="true" hidden></canvas></p>
            <p class="leaderboard-first-player">雪夜長頸鹿</p>
          </div>
          <div class="leaderboard-scroll" id="leaderboard-scroll" tabindex="0" role="region" aria-label="第二名起的排名">
            <table class="leaderboard-table">
              <colgroup>
                <col class="leaderboard-rank-column" />
                <col />
                <col class="leaderboard-score-column" />
              </colgroup>
              <thead>
                <tr><th scope="col">名次</th><th scope="col">玩家</th><th scope="col">分數</th></tr>
              </thead>
              <tbody>
                <tr class="leaderboard-silver"><td><span class="leaderboard-rank">02</span></td><th scope="row">聖誕雪人</th><td>15,280</td></tr>
                <tr class="leaderboard-bronze"><td><span class="leaderboard-rank">03</span></td><th scope="row">星星麋鹿</th><td>12,760</td></tr>
                <tr><td><span class="leaderboard-rank">04</span></td><th scope="row">薑餅小隊</th><td>10,320</td></tr>
                <tr><td><span class="leaderboard-rank">05</span></td><th scope="row">鈴鐺精靈</th><td>9,840</td></tr>
                <tr><td><span class="leaderboard-rank">06</span></td><th scope="row">冰晶松鼠</th><td>8,960</td></tr>
                <tr><td><span class="leaderboard-rank">07</span></td><th scope="row">雪地小熊</th><td>8,410</td></tr>
                <tr><td><span class="leaderboard-rank">08</span></td><th scope="row">冬夜星光</th><td>7,750</td></tr>
                <tr><td><span class="leaderboard-rank">09</span></td><th scope="row">棉花雪兔</th><td>7,120</td></tr>
                <tr><td><span class="leaderboard-rank">10</span></td><th scope="row">暖暖可可</th><td>6,380</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <main class="game-shell" id="game-view" hidden>
      <section class="game-frame" aria-label="打磚塊遊戲">
        <header class="topbar">
          <div class="organizations" role="group" aria-label="機構">
            <div class="organization">
              <img class="organization-logo" src="./assets/organizations/sfang.webp" alt="" width="40" height="40" />
              <span>十方啟能中心</span>
            </div>
            <div class="organization">
              <img class="organization-logo" src="./assets/organizations/wuja.webp" alt="" width="40" height="40" />
              <span>五甲教養院</span>
            </div>
          </div>
          <div class="time-number">
            <output class="sr-only" id="time-left" role="timer" aria-label="剩餘時間"><span id="time-value">2:00</span></output>
            <button class="timer-trigger" id="fullscreen-trigger" type="button" disabled
              aria-label="切換全螢幕" aria-description="快速點兩下倒數數字，或按 Enter。" aria-pressed="false">
              <canvas id="time-pixels" width="26" height="7" aria-hidden="true"></canvas>
            </button>
          </div>
          <a class="game-lobby-link" id="return-to-lobby" href="./">回大廳</a>
        </header>

        <div class="field-stage">
          <div id="field" class="field" tabindex="0" aria-label="遊戲畫面" aria-describedby="controls">
            <div class="arcade-hud" role="group" aria-label="本局資訊">
              <output class="score-number" id="score" aria-live="off" aria-label="本局分數">
                <span class="sr-only" id="score-value">00000</span>
                <canvas id="score-pixels" width="33" height="7" aria-hidden="true"></canvas>
              </output>
              <div class="hearts" id="lives" role="img" aria-label="剩下 3 條命">
                <i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i>
              </div>
            </div>
            <div class="score-popups" id="score-popups" aria-hidden="true"></div>
            <div class="canvas-layer" id="canvas-layer" aria-hidden="true"></div>
            <div class="life-loss-flash" id="life-loss-flash" aria-hidden="true" hidden></div>
            <div class="overlay" id="overlay">
              <div class="overlay-content">
                <h2 id="message">Xmas</h2>
                <p id="detail" hidden></p>
                <p id="level-bonus" class="bonus-score" hidden></p>
                <p id="time-bonus" class="bonus-score" hidden></p>
                <button class="button primary-button" id="action" type="button" disabled>
                  <i class="play-icon" aria-hidden="true"></i><span id="action-label">載入中</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <footer class="game-deck">
          <label class="level-picker" id="level-picker" hidden>
            <span class="stat-label">選擇關卡</span><select id="level-select"></select>
          </label>
          <div class="level-readout" id="level-readout">
            <span class="stat-label">關卡</span><span class="figures"><strong id="level">01</strong><span id="level-total"> / 03</span></span>
          </div>
          <div class="organization deck-brand">
            <img class="organization-logo" src="./assets/organizations/dongshi-giraffe.webp" alt="" width="40" height="40" />
            <span>東勢長頸鹿美語</span>
          </div>
        </footer>
      </section>

      <p class="sr-only" id="controls">用方向鍵或滑鼠移動球拍，空白鍵發球。觸控時左右拖曳移動，輕點發球。</p>
      <p class="sr-only" id="announcement" role="status"></p>
    </main>

    <audio id="background-music" preload="auto" loop hidden></audio>
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="./src/lobby-snow.js"></script>
    <script type="module" src="./src/lobby.js"></script>
  </body>
</html>
