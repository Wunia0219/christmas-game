<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4eb" />
    <meta name="description" content="用球拍接住彈球，打破所有磚塊。使用 PixiJS 製作的復古打磚塊遊戲。" />
    <title>Arkanoid | 打磚塊</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script type="importmap">
      { "imports": { "pixi.js": "./vendor/pixi.mjs" } }
    </script>
  </head>
  <body>
    <header class="page-header">
      <div class="shell header-inner">
        <span class="brand"><i class="brand-icon" aria-hidden="true"></i> ARKANOID</span>
        <button class="button sound-button" id="sound" type="button" aria-pressed="false" disabled>
          <i class="sound-icon" aria-hidden="true"></i><span id="sound-label">音效關</span>
        </button>
      </div>
    </header>

    <main class="shell">
      <div class="hero">
        <div>
          <h1>ARKANOID<span class="title-translation">打磚塊</span></h1>
          <div class="brick-legend" aria-label="特殊磚塊">
            <span><i class="brick-mark extra-ball-mark" aria-hidden="true"></i>擊破釋放 3 顆額外球</span>
            <span><i class="brick-mark buff-mark" aria-hidden="true">?</i>接住掉落道具可強化</span>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <span></span><span></span><span></span><i></i><b></b>
        </div>
      </div>

      <div class="cabinet">
        <section class="game-frame" aria-label="打磚塊遊戲">
          <header class="game-header">
            <div class="game-status">
              <span class="status-light" aria-hidden="true"></span><span id="status">準備就緒</span>
              <span class="ball-count" id="ball-count" hidden></span>
            </div>
            <button class="button pause-button" id="pause" type="button" disabled>
              <i class="pause-icon" aria-hidden="true"></i><span id="pause-label">暫停</span>
            </button>
          </header>
          <div id="field" class="field" tabindex="0" aria-label="遊戲畫面" aria-describedby="controls">
            <div class="canvas-layer" id="canvas-layer" aria-hidden="true"></div>
            <div class="overlay" id="overlay">
              <div class="overlay-content">
                <h2 id="message">準備開打？</h2>
                <p id="detail" hidden></p>
                <button class="button primary-button" id="action" type="button" disabled>
                  <i class="play-icon" aria-hidden="true"></i><span id="action-label">載入中</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <aside class="sidebar" aria-label="遊戲資訊">
          <section class="score-panel" aria-label="計分板">
            <div class="score-current">
              <span class="stat-label">分數</span><output class="score-number" id="score" aria-live="off">00000</output>
            </div>
            <div class="score-best">
              <span class="stat-label">最高分</span><output id="best" aria-live="off">00000</output>
            </div>
          </section>

          <section class="stats-panel" aria-label="關卡進度">
            <div class="stat-row">
              <span class="stat-label" id="lives-label">生命</span>
              <div class="hearts" id="lives" role="img" aria-label="剩下 3 條命">
                <i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i>
              </div>
            </div>
            <div class="stat-row">
              <span class="stat-label">關卡</span><span class="figures"><strong id="level">01</strong><span id="level-total"> / 03</span></span>
            </div>
            <div class="brick-status">
              <div class="stat-row"><span class="stat-label" id="brick-label">剩餘磚塊</span><span class="figures" id="remaining">50</span></div>
              <progress id="progress" aria-labelledby="brick-label" max="50" value="50"></progress>
            </div>
            <section class="buff-status" aria-label="限時強化">
              <div class="buff-heading"><span class="stat-label">限時強化</span><span class="buff-idle" id="buff-idle">待收集</span></div>
              <ul class="buff-list" id="buff-list" hidden>
                <li id="buff-wide" hidden><span>球拍加長</span><span class="buff-time"></span></li>
                <li id="buff-fast" hidden><span>球拍加速</span><span class="buff-time"></span></li>
                <li id="buff-guards" hidden><span>底線保護 <span id="guard-count"></span></span><span class="buff-time"></span></li>
                <li id="buff-cannons" hidden><span>雙側砲台</span><span class="buff-time"></span></li>
              </ul>
            </section>
          </section>

          <button class="button restart-button" id="restart" type="button" disabled><span aria-hidden="true">↻</span> 重新開始</button>
        </aside>
      </div>

      <section class="controls" id="controls" aria-label="操作方式">
        <span class="controls-title">操作方式</span>
        <span class="keys keyboard-control"><kbd>←</kbd><kbd>→</kbd> 移動</span>
        <span class="keys keyboard-control"><kbd>Space</kbd> 發球</span>
        <span class="keys keyboard-control"><kbd>Esc</kbd> 暫停</span>
        <span class="pointer-controls"><i class="pointer-icon" aria-hidden="true"></i><span class="mouse-instructions">也可用滑鼠移動球拍</span><span class="touch-instructions">左右拖曳球拍，輕點發球</span></span>
      </section>
      <p class="sr-only" id="announcement" role="status"></p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
